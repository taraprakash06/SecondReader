<svg xmlns="http://www.w3.org/2000/svg" width="280" height="200" viewBox="0 0 280 200">
  <defs>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" stitchTiles="stitch" result="t" />
      <feColorMatrix in="t" type="saturate" values="0" result="g" />
      <feComponentTransfer in="g" result="o">
        <feFuncA type="linear" slope="0.35" />
      </feComponentTransfer>
    </filter>
    <filter id="blurText" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.6" />
    </filter>
    <!-- Faint editorial / manuscript ticks (tile-friendly) -->
    <pattern id="marks" width="44" height="36" patternUnits="userSpaceOnUse">
      <path d="M6 26 L11 21" stroke="#0f0f13" stroke-width="0.45" stroke-linecap="round" opacity="0.4" />
      <path d="M22 14 L27 9" stroke="#0f0f13" stroke-width="0.4" stroke-linecap="round" opacity="0.35" />
      <path d="M34 28 L38 24" stroke="#0f0f13" stroke-width="0.35" stroke-linecap="round" opacity="0.3" />
      <circle cx="16" cy="30" r="0.55" fill="#0f0f13" opacity="0.35" />
    </pattern>
  </defs>
  <!-- Paper grain (kept light; CSS layers add lines + grid) -->
  <rect width="100%" height="100%" filter="url(#grain)" fill="#0f0f13" opacity="0.22" />
  <rect width="100%" height="100%" fill="url(#marks)" opacity="0.45" />
  <!-- Very faint blurred book-like text -->
  <g filter="url(#blurText)" fill="#0f0f13" fill-opacity="0.38" font-family="Georgia, 'Times New Roman', serif" font-size="8.5">
    <text x="12" y="36">The draft remembers every word</text>
    <text x="12" y="52">that lingered on the page unheard.</text>
    <text x="12" y="84" fill-opacity="0.9">A margin note, a careful mark—</text>
  </g>
</svg>
